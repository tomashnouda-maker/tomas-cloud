<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOMAS CLOUD - VERTICAL CODE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap');
        body { background: #020617; overflow: hidden; font-family: 'Cairo', sans-serif; margin: 0; touch-action: none; }
        
        .connector { position: absolute; height: 1.5px; transform-origin: left center; z-index: 10; opacity: 0.4; animation: flow 2s infinite linear; }
        @keyframes flow { 0% { opacity: 0.2; } 50% { opacity: 0.6; } 100% { opacity: 0.2; } }

        .node-box { position: absolute; z-index: 20; backdrop-filter: blur(8px); background: rgba(15, 23, 42, 0.9); border-width: 2px; padding: 6px 12px; border-radius: 12px; cursor: pointer; }
        .node-text { font-size: 10px; font-weight: bold; color: white; white-space: nowrap; }

        /* شاشة عرض الشفرة - مرتبة تحت بعضها */
        #code-display-area {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 200; flex-direction: column; padding: 15px;
        }
        #code-text { 
            background: #0f172a; color: #38bdf8; padding: 15px; border-radius: 10px; 
            font-family: 'Courier New', Courier, monospace; font-size: 12px; 
            overflow-y: auto; overflow-x: auto; flex-grow: 1;
            /* السر هنا: تجعل الأكواد تظهر تحت بعضها وتدعم الفراغات */
            white-space: pre; 
            text-align: left; direction: ltr; border: 1px solid #1e293b;
            line-height: 1.5;
        }

        #options-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-24 h-24 bg-blue-500/10 border-2 border-blue-500 rounded-full flex items-center justify-center z-30">
        <div class="text-center">
            <span class="text-blue-500 font-black text-sm block">TOMAS</span>
        </div>
    </div>

    <div id="options-modal">
        <div class="bg-slate-900 border border-blue-500/50 p-6 rounded-2xl text-center max-w-[260px] w-full mx-4 shadow-2xl">
            <h2 id="modal-title" class="text-white font-bold mb-5 text-sm"></h2>
            <div class="flex flex-col gap-3">
                <button id="btn-url" class="bg-blue-600 text-white py-3 rounded-xl font-bold text-xs">فتح الرابط (URL)</button>
                <button id="btn-html" class="bg-amber-500 text-white py-3 rounded-xl font-bold text-xs">عرض شفرة HTML</button>
                <button onclick="closeAll()" class="text-slate-500 mt-2 text-[10px]">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="code-display-area">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-amber-500 font-bold text-xs">Source Code (شفرة الموقع)</h3>
            <button onclick="closeAll()" class="bg-red-600 text-white px-4 py-1 rounded-md text-[10px]">خروج</button>
        </div>
        <div id="code-text"></div>
    </div>

    <div id="network-container" class="relative w-screen h-screen"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://tomascloudnetwork-default-rtdb.firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const optModal = document.getElementById('options-modal');
        const codeArea = document.getElementById('code-display-area');
        const codeText = document.getElementById('code-text');

        window.closeAll = () => { optModal.style.display = 'none'; codeArea.style.display = 'none'; };

        onValue(ref(db, 'network/nodes'), (snapshot) => {
            const nodes = snapshot.val();
            const container = document.getElementById('network-container');
            container.innerHTML = ''; 
            if(!nodes) return;

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            const radius = Math.min(window.innerWidth, window.innerHeight) * 0.32;
            const entries = Object.entries(nodes);

            entries.forEach(([id, data], index) => {
                const angle = (index / entries.length) * Math.PI * 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                const line = document.createElement('div');
                line.className = 'connector';
                line.style.width = radius + 'px';
                line.style.left = centerX + 'px'; line.style.top = centerY + 'px';
                line.style.transform = `rotate(${angle}rad)`;
                line.style.background = `linear-gradient(90deg, ${data.color}, transparent)`;
                container.appendChild(line);

                const nodeDiv = document.createElement('div');
                nodeDiv.className = 'node-box';
                nodeDiv.style.borderColor = data.color;
                nodeDiv.style.left = (x - 45) + 'px'; nodeDiv.style.top = (y - 15) + 'px';
                nodeDiv.innerHTML = `<span class="node-text">${data.name}</span>`;
                
                nodeDiv.onclick = () => {
                    document.getElementById('modal-title').innerText = data.name;
                    optModal.style.display = 'flex';
                    
                    document.getElementById('btn-url').onclick = () => {
                        if(data.url) window.open(data.url, '_blank');
                        closeAll();
                    };

                    document.getElementById('btn-html').onclick = () => {
                        optModal.style.display = 'none';
                        codeArea.style.display = 'flex';
                        // استخدام التنسيق الذي يحافظ على الأسطر تحت بعضها
                        codeText.textContent = data.html_code || "لا توجد شفرة مضافة";
                    };
                };
                container.appendChild(nodeDiv);
            });
        });
    </script>
</body>
</html>
