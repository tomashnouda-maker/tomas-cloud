<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tomas Cloud Network | Pro Edition</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        /* خلفية احترافية متدرجة بدلاً من الأسود */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d); /* تدرج لوني احترافي */
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white; 
            overflow: hidden; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #mynetwork { width: 100vw; height: 100vh; }
        
        /* النافذة المنبثقة بتصميم زجاجي */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); 
            backdrop-filter: blur(12px);
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            margin: 5% auto; padding: 30px; border-radius: 25px;
            width: 80%; max-height: 80vh; overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.37);
            color: #fff;
        }
        .close { float: left; color: #ff4b2b; font-size: 35px; cursor: pointer; }
        
        .btn-group { margin: 25px 0; display: flex; gap: 15px; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 15px;
            cursor: pointer; font-weight: bold; text-decoration: none;
            transition: 0.3s; color: white;
        }
        .btn-visit { background: linear-gradient(to right, #00c6ff, #0072ff); }
        .btn-code { background: linear-gradient(to right, #11998e, #38ef7d); }

        pre {
            background-color: #0d0d0d; color: #00ff00; 
            padding: 20px; border-radius: 15px; border: 1px solid #333;
            direction: ltr; text-align: left; white-space: pre-wrap; 
            font-family: 'Consolas', monospace; box-shadow: inset 0 0 10px #000;
        }
    </style>
</head>
<body>

<div id="mynetwork"></div>

<div id="optionsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="projectName" style="color: #fdbb2d;">اسم الموقع</h2>
        <div class="btn-group">
            <a id="visitLink" href="#" target="_blank" class="btn btn-visit">دخول الموقع</a>
            <button class="btn btn-code" onclick="toggleCode()">عرض الشفرة HTML</button>
        </div>
        <div id="codeSection" style="display:none;">
            <pre id="htmlCodeDisplay"></pre>
        </div>
    </div>
</div>

<script>
    const firebaseURL = "https://tomascloudnetwork-default-rtdb.firebaseio.com/.json";

    async function updateNetwork() {
        try {
            const response = await fetch(firebaseURL);
            const data = await response.json();
            const users = data.network.users;

            const nodes = [];
            const edges = [];

            // العقدة المركزية الكبرى (تصميم زجاجي أبيض)
            nodes.push({ 
                id: 'main', label: 'TOMAS\nNETWORK', shape: 'circle',
                color: { background: 'rgba(255,255,255,0.9)', border: '#fff' },
                font: { size: 22, color: '#000', bold: true },
                shadow: { enabled: true, color: 'rgba(255,255,255,0.5)', size: 20 }
            });

            Object.keys(users).forEach(userKey => {
                const user = users[userKey];
                const userColor = user.color || '#ffffff';

                // عقدة المستخدم
                nodes.push({
                    id: userKey,
                    label: user.name || userKey,
                    shape: 'circle',
                    size: 30,
                    color: { background: '#fff', border: userColor },
                    font: { color: '#000', size: 16, bold: true },
                    borderWidth: 4,
                    shadow: { enabled: true, color: userColor, size: 15 }
                });

                edges.push({ from: 'main', to: userKey, color: { color: '#fff' }, width: 3 });

                if (user.projects) {
                    Object.keys(user.projects).forEach(pKey => {
                        const project = user.projects[pKey];
                        const projectId = `${userKey}_${pKey}`;
                        
                        // الحل لعرض اسم الموقع بدقة:
                        // إذا وجد name داخل المشروع سيعرضه، وإذا لم يجد سيعرض p1 أو p2
                        const siteTitle = project.name ? project.name : pKey;

                        nodes.push({
                            id: projectId,
                            label: siteTitle,
                            shape: 'box',
                            margin: 10,
                            color: { background: 'rgba(0,0,0,0.5)', border: userColor },
                            font: { color: '#fff', size: 14 },
                            borderRadius: 10,
                            data: project 
                        });

                        edges.push({ from: userKey, to: projectId, color: { color: userColor }, width: 2, dashes: true });
                    });
                }
            });

            const container = document.getElementById('mynetwork');
            const networkData = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
            const options = {
                physics: { enabled: true, solver: 'repulsion', repulsion: { nodeDistance: 150 } },
                interaction: { hover: true }
            };

            const network = new vis.Network(container, networkData, options);

            network.on("click", function (params) {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const clickedNode = nodes.find(n => n.id === nodeId);
                    if (clickedNode && clickedNode.data) showModal(clickedNode.label, clickedNode.data);
                }
            });

        } catch (error) { console.error(error); }
    }

    function showModal(name, project) {
        document.getElementById('projectName').innerText = name;
        document.getElementById('visitLink').href = project.url || "#";
        document.getElementById('htmlCodeDisplay').textContent = formatHTML(project.html_code || "");
        document.getElementById('codeSection').style.display = 'none';
        document.getElementById('optionsModal').style.display = 'block';
    }

    function formatHTML(html) {
        let tab = '    '; let result = ''; let indent= '';
        html.split(/>\s*</).forEach(function(element) {
            if (element.match( /^\/\w/ )) indent = indent.substring(tab.length);
            result += indent + '<' + element + '>\r\n';
            if (element.match( /^<?\w[^>]*[^\/]$/ )) indent += tab;
        });
        return result.substring(1, result.length-3);
    }

    function closeModal() { document.getElementById('optionsModal').style.display = 'none'; }
    function toggleCode() {
        const sec = document.getElementById('codeSection');
        sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
    }

    // تحديث تلقائي كل 10 ثوانٍ لجلب أي إضافة جديدة من فيربيس
    setInterval(updateNetwork, 10000); 
    updateNetwork();
</script>

</body>
</html>
