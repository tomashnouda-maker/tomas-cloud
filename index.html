<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOMAS CLOUD NETWORK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&family=Cairo:wght@600;900&display=swap');
        
        body { 
            background: #020617; 
            overflow: hidden; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            touch-action: none; 
        }

        /* الدائرة المركزية مصغرة لتناسب الموبايل */
        #center-node {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 75px; height: 75px; background: rgba(15, 23, 42, 0.95);
            border: 2px solid #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 50; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); text-align: center;
        }

        /* صندوق عرض الكود - تحت بعضه ومنظم */
        #code-box {
            background: #010409;
            color: #7ee787;
            padding: 12px;
            border-radius: 8px;
            font-family: 'monospace';
            font-size: 10px;
            line-height: 1.4;
            height: 60vh;
            overflow-y: auto;
            overflow-x: hidden;
            text-align: left;
            direction: ltr;
            width: 92vw;
            border: 1px solid #30363d;
            white-space: pre-wrap; /* لجعل الكود يظهر تحت بعضه */
            word-wrap: break-word;
            word-break: break-all;
        }

        .connector { 
            position: absolute; 
            height: 1.2px; 
            transform-origin: left center; 
            z-index: 10; 
            opacity: 0.5; 
        }
        
        .user-node { 
            position: absolute; z-index: 30; background: #1e293b; 
            border: 2px solid var(--u-color); padding: 4px 10px; border-radius: 10px; 
            font-weight: 900; font-size: 10px; color: white; 
            transform: translate(-50%, -50%); box-shadow: 0 0 10px var(--u-color); 
        }

        .project-node { 
            position: absolute; z-index: 20; background: #0f172a; 
            border: 1px solid var(--u-color); padding: 4px 8px; border-radius: 5px; 
            font-size: 9px; color: #cbd5e1; transform: translate(-50%, -50%); 
        }

        #modal, #code-viewer { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); 
            z-index: 100; align-items: center; justify-content: center; flex-direction: column; 
        }
    </style>
</head>
<body>

    <!-- الدائرة المركزية -->
    <div id="center-node">
        <div class="px-1">
            <div class="text-[7px] text-blue-400 font-bold tracking-widest uppercase">Tomas</div>
            <div class="text-[8px] font-black text-white leading-tight uppercase">Network</div>
        </div>
    </div>

    <div id="canvas" class="relative w-screen h-screen"></div>

    <!-- نافذة التحكم بالموقع -->
    <div id="modal" onclick="this.style.display='none'">
        <div class="bg-slate-900 border border-blue-500 p-6 rounded-2xl w-[80%] max-w-xs text-center" onclick="event.stopPropagation()">
            <h3 id="m-title" class="text-md font-bold mb-6 text-white border-b border-slate-700 pb-2"></h3>
            <div class="flex flex-col gap-3">
                <button id="btn-open" class="bg-blue-600 text-white py-3 rounded-xl font-bold active:scale-95">OPEN URL</button>
                <button id="btn-show-code" class="bg-slate-700 text-white py-3 rounded-xl font-bold active:scale-95">VIEW SOURCE</button>
            </div>
        </div>
    </div>

    <!-- شاشة عرض السورس كود -->
    <div id="code-viewer">
        <div class="text-blue-400 text-[10px] mb-2 font-bold uppercase tracking-widest">Source Code Archive</div>
        <pre id="code-box"></pre>
        <button onclick="document.getElementById('code-viewer').style.display='none'" class="mt-4 bg-red-600 text-white px-10 py-3 rounded-full font-bold text-sm active:scale-95">CLOSE</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://tomascloudnetwork-default-rtdb.firebaseio.com" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const canvas = document.getElementById('canvas');

        // المسار كما هو بدون تغيير network/users
        onValue(ref(db, 'network/users'), (snapshot) => {
            canvas.innerHTML = '';
            const users = snapshot.val();
            if (!users) return;

            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const userKeys = Object.keys(users);
            
            userKeys.forEach((uKey, i) => {
                const user = users[uKey];
                const uAngle = (i / userKeys.length) * Math.PI * 2;
                
                // تصغير المسافات لتناسب شاشات الموبايل
                const ux = cx + 90 * Math.cos(uAngle);
                const uy = cy + 90 * Math.sin(uAngle);

                drawLink(cx, cy, ux, uy, user.color || '#3b82f6');

                const uEl = document.createElement('div');
                uEl.className = 'user-node';
                uEl.style.left = ux + 'px'; uEl.style.top = uy + 'px';
                uEl.style.setProperty('--u-color', user.color || '#3b82f6');
                uEl.innerText = user.name;
                canvas.appendChild(uEl);

                if (user.projects) {
                    const pKeys = Object.keys(user.projects);
                    pKeys.forEach((pKey, j) => {
                        const project = user.projects[pKey];
                        const pAngle = uAngle + (j - (pKeys.length - 1) / 2) * 0.75;
                        
                        // تصغير مسافة المشاريع عن المستخدم
                        const px = ux + 65 * Math.cos(pAngle);
                        const py = uy + 65 * Math.sin(pAngle);

                        drawLink(ux, uy, px, py, user.color || '#3b82f6');

                        const pEl = document.createElement('div');
                        pEl.className = 'project-node';
                        pEl.style.left = px + 'px'; pEl.style.top = py + 'px';
                        pEl.style.setProperty('--u-color', user.color || '#3b82f6');
                        pEl.innerText = project.name;
                        
                        pEl.onclick = () => {
                            document.getElementById('m-title').innerText = project.name;
                            document.getElementById('modal').style.display = 'flex';
                            document.getElementById('btn-open').onclick = () => window.open(project.url, '_blank');
                            document.getElementById('btn-show-code').onclick = () => {
                                document.getElementById('modal').style.display = 'none';
                                document.getElementById('code-viewer').style.display = 'flex';
                                // عرض الكود بتنسيق الأسطر المتتالية
                                document.getElementById('code-box').textContent = project.html_code;
                            };
                        };
                        canvas.appendChild(pEl);
                    });
                }
            });
        });

        function drawLink(x1, y1, x2, y2, color) {
            const dist = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
            const angle = Math.atan2(y2-y1, x2-x1);
            const line = document.createElement('div');
            line.className = 'connector';
            line.style.width = dist + 'px';
            line.style.left = x1 + 'px';
            line.style.top = y1 + 'px';
            line.style.transform = `rotate(${angle}rad)`;
            line.style.background = `linear-gradient(90deg, #3b82f6, ${color})`;
            canvas.appendChild(line);
        }
    </script>
</body>
</html>
