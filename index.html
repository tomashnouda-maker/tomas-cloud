<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Tomas Cloud Network | Pro Edition</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d); 
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white; 
            overflow: hidden; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #mynetwork { width: 100vw; height: 100vh; outline: none; }
        
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); 
            backdrop-filter: blur(12px);
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            margin: 5% auto; padding: 30px; border-radius: 25px;
            width: 80%; max-height: 80vh; overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0,0,0,0.37);
            color: #fff;
        }
        .close { float: left; color: #ff4b2b; font-size: 35px; cursor: pointer; }
        
        .btn-group { margin: 25px 0; display: flex; gap: 15px; }
        .btn {
            padding: 12px 30px; border: none; border-radius: 15px;
            cursor: pointer; font-weight: bold; text-decoration: none;
            transition: 0.3s; color: white;
        }
        .btn-visit { background: linear-gradient(to right, #00c6ff, #0072ff); }
        .btn-code { background: linear-gradient(to right, #11998e, #38ef7d); }

        /* تعديل عرض الكود ليكون تحت بعضه البعض */
        pre {
            background-color: #0d0d0d; color: #00ff00; 
            padding: 20px; border-radius: 15px; border: 1px solid #333;
            direction: ltr; text-align: left; 
            white-space: pre-wrap; /* يضمن بقاء الكود تحت بعضه وتغليف الأسطر الطويلة */
            word-break: break-all;
            font-family: 'Consolas', monospace; box-shadow: inset 0 0 10px #000;
            overflow: auto;
        }
    </style>
</head>
<body>

<div id="mynetwork"></div>

<div id="optionsModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">&times;</span>
        <h2 id="projectName" style="color: #fdbb2d;">اسم الموقع</h2>
        <div class="btn-group">
            <a id="visitLink" href="#" target="_blank" class="btn btn-visit">دخول الموقع</a>
            <button class="btn btn-code" onclick="toggleCode()">عرض الشفرة HTML</button>
        </div>
        <div id="codeSection" style="display:none;">
            <pre id="htmlCodeDisplay"></pre>
        </div>
    </div>
</div>

<script>
    const firebaseURL = "https://tomascloudnetwork-default-rtdb.firebaseio.com/.json";
    let network = null;
    let nodesDataSet = new vis.DataSet();
    let edgesDataSet = new vis.DataSet();
    let isRotating = true; 
    let rotationInterval = null;
    let originalPositions = {};

    async function updateNetwork() {
        try {
            const response = await fetch(firebaseURL);
            const data = await response.json();
            const users = data.network.users;

            const nodes = [];
            const edges = [];

            nodes.push({ 
                id: 'main', label: 'TOMAS\nNETWORK', shape: 'circle',
                x: 0, y: 0, fixed: true,
                color: { background: 'rgba(255,255,255,0.9)', border: '#fff' },
                font: { size: 22, color: '#000', bold: true },
                shadow: { enabled: true, color: 'rgba(255,255,255,0.5)', size: 20 }
            });

            let i = 0;
            const userKeys = Object.keys(users);
            userKeys.forEach(userKey => {
                const user = users[userKey];
                const userColor = user.color || '#ffffff';
                const angle = (i / userKeys.length) * Math.PI * 2;
                
                const ux = Math.cos(angle) * 250;
                const uy = Math.sin(angle) * 250;
                originalPositions[userKey] = { x: ux, y: uy };

                nodes.push({
                    id: userKey, label: user.name || userKey, shape: 'circle', size: 30,
                    x: ux, y: uy,
                    color: { background: '#fff', border: userColor },
                    font: { color: '#000', size: 16, bold: true },
                    borderWidth: 4, fixed: true
                });

                edges.push({ from: 'main', to: userKey, color: { color: '#fff' }, width: 3 });

                if (user.projects) {
                    const pKeys = Object.keys(user.projects);
                    pKeys.forEach((pKey, pIdx) => {
                        const project = user.projects[pKey];
                        const projectId = `${userKey}_${pKey}`;
                        const pAngle = angle + (pIdx + 1) * 0.3;
                        
                        const px = Math.cos(pAngle) * 400;
                        const py = Math.sin(pAngle) * 400;
                        originalPositions[projectId] = { x: px, y: py };

                        nodes.push({
                            id: projectId, label: project.name || pKey, shape: 'box', margin: 10,
                            x: px, y: py,
                            color: { background: 'rgba(0,0,0,0.5)', border: userColor },
                            font: { color: '#fff', size: 14 },
                            borderRadius: 10, fixed: true, data: project 
                        });

                        edges.push({ from: userKey, to: projectId, color: { color: userColor }, width: 2, dashes: true });
                    });
                }
                i++;
            });

            nodesDataSet.clear();
            nodesDataSet.add(nodes);
            edgesDataSet.clear();
            edgesDataSet.add(edges);

            if (!network) {
                const container = document.getElementById('mynetwork');
                network = new vis.Network(container, { nodes: nodesDataSet, edges: edgesDataSet }, {
                    physics: { enabled: false },
                    interaction: { hover: true }
                });

                startRotation();

                network.on("click", function (params) {
                    if (params.nodes.length > 0) {
                        const nodeId = params.nodes[0];
                        if (nodeId === 'main') {
                            isRotating = !isRotating;
                            if (isRotating) startRotation();
                            else stopRotationAndReset();
                        } else if (!isRotating) {
                            const clickedNode = nodesDataSet.get(nodeId);
                            if (clickedNode && clickedNode.data) showModal(clickedNode.label, clickedNode.data);
                        }
                    }
                });
            }

        } catch (error) { console.error(error); }
    }

    function startRotation() {
        if(rotationInterval) clearInterval(rotationInterval);
        const speed = 0.008;
        rotationInterval = setInterval(() => {
            const allNodes = nodesDataSet.get();
            allNodes.forEach(node => {
                if (node.id !== 'main') {
                    const x = node.x; const y = node.y;
                    const cos = Math.cos(speed); const sin = Math.sin(speed);
                    nodesDataSet.update({ id: node.id, x: x * cos - y * sin, y: x * sin + y * cos });
                }
            });
        }, 16);
    }

    function stopRotationAndReset() {
        clearInterval(rotationInterval);
        Object.keys(originalPositions).forEach(id => {
            nodesDataSet.update({
                id: id,
                x: originalPositions[id].x,
                y: originalPositions[id].y
            });
        });
        network.moveTo({ position: {x:0, y:0}, scale: 1, animation: true });
    }

    function showModal(name, project) {
        document.getElementById('projectName').innerText = name;
        document.getElementById('visitLink').href = project.url || "#";
        // عرض الكود المصدري الأصلي كما هو مخزن تماماً
        document.getElementById('htmlCodeDisplay').textContent = project.html_code || "";
        document.getElementById('codeSection').style.display = 'none';
        document.getElementById('optionsModal').style.display = 'block';
    }

    function closeModal() { document.getElementById('optionsModal').style.display = 'none'; }
    function toggleCode() {
        const sec = document.getElementById('codeSection');
        sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
    }

    updateNetwork();
</script>

</body>
</html>
